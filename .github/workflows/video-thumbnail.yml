name: Generate Video Thumbnails

on:
  push:
    branches:
      - Backgrounds   # triggers on any commit to Backgrounds
  workflow_dispatch:   # allows manual trigger

jobs:
  create-thumbnails:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the Backgrounds branch
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          ref: Backgrounds

      # 2️⃣ Install ffmpeg
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # 3️⃣ Debug: show working directory and list videos
      - name: List video files for debugging
        run: |
          echo "Current directory: $(pwd)"
          echo "Contents of Backgrounds/Videos:"
          ls -l Backgrounds/Videos || echo "No videos found"

      # 4️⃣ Generate thumbnails safely
      - name: Generate thumbnails
        run: |
          mkdir -p Backgrounds/VideoThumbnails
          shopt -s nullglob
          count=0
          for f in Backgrounds/Videos/*.mp4; do
            echo "Processing $f"
            filename=$(basename "$f" .mp4)
            thumb_file="Backgrounds/VideoThumbnails/${filename}-thumb.jpg"
            if [ ! -f "$thumb_file" ]; then
              ffmpeg -i "$f" -ss 00:00:02 -vframes 1 "$thumb_file"
              ((count++))
            else
              echo "Thumbnail already exists: $thumb_file"
            fi
          done
          echo "Total new thumbnails created: $count"

      # 5️⃣ Commit only if new thumbnails were created
      - name: Commit new thumbnails
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Backgrounds/VideoThumbnails/
          if ! git diff --cached --quiet; then
            git commit -m "Add video thumbnails"
            git push origin Backgrounds
          else
            echo "No new thumbnails to commit"
