name: Generate Video Thumbnails

on:
  push:
    branches:
      - Backgrounds
    paths:
      - 'Backgrounds/Videos/*.mp4'
  workflow_dispatch:   # allows manual trigger

jobs:
  create-thumbnails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          ref: Backgrounds   # important: checkout Backgrounds branch to access videos

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Generate thumbnails
        run: |
          mkdir -p Backgrounds/VideoThumbnails
          shopt -s nullglob
          for f in Backgrounds/Videos/*.mp4; do
            echo "Processing $f"
            filename=$(basename "$f" .mp4)
            ffmpeg -i "$f" -ss 00:00:02 -vframes 1 "Backgrounds/VideoThumbnails/${filename}-thumb.jpg"
          done


      - name: Commit thumbnails
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Backgrounds/VideoThumbnails/
          # Only commit if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "Add video thumbnails"
            git push origin Backgrounds
          else
            echo "No new thumbnails to commit"
          fi

